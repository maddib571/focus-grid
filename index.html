<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Grid - Weekly Timetable</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f5f3ff; /* Light purple background */
            color: #1e1b4b; /* Dark purple text */
            padding: 30px 20px;
            margin: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* App Header */
        .app-header {
            text-align: left;
            margin-bottom: 24px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            color: #6b21a8; /* Main Purple branding */
            letter-spacing: -0.5px;
        }
        .app-header p {
            margin: 4px 0 0 0;
            color: #6b7280;
            font-size: 14px;
        }
        
        /* Input Card Layout */
        .input-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e9d5ff;
            box-shadow: 0 4px 6px -1px rgba(107, 33, 168, 0.05);
            margin-bottom: 24px;
            text-align: left;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: #4c1d95;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #5b21b6;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #ddd6fe;
            font-size: 15px;
            color: #1e1b4b;
            box-sizing: border-box;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        /* Action Buttons */
        .btn-container {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #7c3aed;
            color: white;
        }
        .btn-primary:hover { background-color: #6d28d9; }
        
        .btn-secondary {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #fee2e2;
        }
        .btn-secondary:hover { background-color: #fef2f2; }

        /* Control Panel */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn-edit { background-color: #f3e8ff; color: #6b21a8; }
        .btn-edit.active { background-color: #ef4444; color: white; }
        .btn-download { background-color: #10b981; color: white; }
        .btn-download:hover { background-color: #059669; }

        /* Legend */
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        /* Timetable Structure */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e9d5ff;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(107, 33, 168, 0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #f3e8ff;
            padding: 12px;
            text-align: center;
            min-width: 120px;
            vertical-align: middle;
        }
        th {
            background-color: #faf5ff;
            color: #6b21a8;
            font-weight: 600;
            font-size: 14px;
        }
        .time-column {
            font-weight: 600;
            color: #4c1d95;
            background-color: #faf5ff;
            width: 130px;
            min-width: 130px;
            font-size: 13px;
        }
        
        /* Activity Blocks */
        .activity-block {
            color: white;
            border-radius: 6px;
            padding: 8px 6px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

       /* Fixed Print Settings to Prevent Cropping */
        @media print {
            /* 1. Hide input card and controls completely */
            .app-header, .input-card, .control-panel, .delete-btn {
                display: none !important;
            }
            
            /* 2. Reset page margins and force landscape sizing */
            @page {
                size: landscape;
                margin: 10mm; /* Gives a clean safety margin around the paper */
            }
            
            body { 
                padding: 0; 
                margin: 0; 
                background: white; 
                width: 100% !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            
            /* 3. Force the container to lock inside the page width */
            .table-container { 
                border: none; 
                padding: 0; 
                box-shadow: none;
                width: 100% !important;
                max-width: 100% !important;
                overflow: visible !important;
            }
            
            table {
                width: 100% !important;
                max-width: 100% !important;
                border-collapse: collapse;
                table-layout: fixed; /* Forces all columns to divide the page space equally */
            }

            th, td {
                padding: 8px 4px !important; /* Reduced padding to fit text without breaking columns */
                font-size: 12px !important;  /* Slightly smaller font to guarantee it fits A4 landscape */
                word-wrap: break-word;       /* Forces long words to wrap instead of pushing boundaries */
                min-width: 0 !important;     /* Removes the previous min-width restriction */
            }

            th { 
                background-color: #f3e8ff !important; 
                color: #6b21a8 !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }

            .time-column { 
                background-color: #faf5ff !important; 
                color: #4c1d95 !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                width: 12% !important; /* Locks the time column size safely */
            }

            .activity-block { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                padding: 6px 4px !important;
                font-size: 11px !important;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <h1>Focus Grid</h1>
        <p>Organize your weekly activities effortlessly</p>
    </div>
    
    <div class="input-card">
        <div class="card-title">Add activity</div>
        
        <div class="form-group">
            <label for="activityInput">Activity name</label>
            <input type="text" id="activityInput" placeholder="e.g. Math lecture, Gym, Study group">
        </div>
        
        <div class="form-row">
            <div>
                <label for="dayInput">Day</label>
                <select id="dayInput">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday" selected>Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div>
                <label for="startTimeInput">Start time</label>
                <input type="time" id="startTimeInput" value="23:00">
            </div>
            <div>
                <label for="endTimeInput">End time</label>
                <input type="time" id="endTimeInput" value="00:00">
            </div>
            <div>
                <label for="categoryInput">Category (optional)</label>
                <select id="categoryInput">
                    <option value="Class">Class</option>
                    <option value="Study">Study</option>
                    <option value="Gym">Gym / Sport</option>
                    <option value="Leisure">Leisure</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        
        <div class="btn-container">
            <button class="btn btn-primary" onclick="addActivity()">Add to timetable</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear all</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="legend" id="colorLegend"></div>
        <div>
            <button class="btn btn-edit" id="editBtn" onclick="toggleEdit()">Edit Mode: OFF</button>
            <button class="btn btn-download" onclick="downloadSchedule()">Complete & Download</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                    <th>Saturday</th>
                    <th>Sunday</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let activities = [];
    let isEditMode = false;
    const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    
    const categoryColors = {
        "Class": "#3b82f6",    
        "Study": "#10b981",    
        "Gym": "#f59e0b",      
        "Leisure": "#8b5cf6",  
        "Other": "#64748b"     
    };

    function buildLegend() {
        const legend = document.getElementById('colorLegend');
        legend.innerHTML = '';
        for (const [category, color] of Object.entries(categoryColors)) {
            legend.innerHTML += `
                <div class="legend-item">
                    <div class="color-box" style="background-color: ${color};"></div>
                    <span>${category}</span>
                </div>`;
        }
    }

    function formatTo12Hour(timeString) {
        if(!timeString) return "";
        const [hours, minutes] = timeString.split(':');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 || 12;
        return `${formattedHours}:${minutes} ${ampm}`;
    }

    function addActivity() {
        const startVal = document.getElementById('startTimeInput').value;
        const endVal = document.getElementById('endTimeInput').value;
        const day = document.getElementById('dayInput').value;
        const category = document.getElementById('categoryInput').value;
        const name = document.getElementById('activityInput').value;

        if (!startVal || !endVal || !name) {
            alert("Please fill out the Activity Name, Start Time, and End Time!");
            return;
        }

        const displayTimeRange = `${formatTo12Hour(startVal)} - ${formatTo12Hour(endVal)}`;

        activities.push({
            rawStart: startVal,
            displayTime: displayTimeRange,
            day: day,
            category: category,
            name: name,
            color: categoryColors[category],
            id: Date.now()
        });

        document.getElementById('activityInput').value = '';
        renderTimetable();
    }

    function clearAll() {
        if (confirm("Are you sure you want to clear your entire schedule?")) {
            activities = [];
            renderTimetable();
        }
    }

    function toggleEdit() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('editBtn');
        if (isEditMode) {
            btn.innerText = "Edit Mode: ON";
            btn.classList.add('active');
        } else {
            btn.innerText = "Edit Mode: OFF";
            btn.classList.remove('active');
        }
        renderTimetable();
    }

    function removeActivity(id) {
        activities = activities.filter(act => act.id !== id);
        renderTimetable();
    }

    function renderTimetable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const sortedTimes = [...new Set(activities.map(act => act.rawStart))].sort();

        sortedTimes.forEach(rawStart => {
            const row = document.createElement('tr');
            const matches = activities.filter(act => act.rawStart === rawStart);
            
            const timeTd = document.createElement('td');
            timeTd.className = 'time-column';
            timeTd.innerHTML = `<strong>${matches[0].displayTime}</strong>`;
            row.appendChild(timeTd);

            daysOfWeek.forEach(day => {
                const cell = document.createElement('td');
                const matchedAct = activities.find(act => act.rawStart === rawStart && act.day === day);

                if (matchedAct) {
                    let cellData = `
                        <div class="activity-block" style="background-color: ${matchedAct.color};">
                            ${matchedAct.name}
                        </div>`;
                    
                    if (isEditMode) {
                        cellData += `<button class="delete-btn" onclick="removeActivity(${matchedAct.id})">Delete</button>`;
                    }
                    cell.innerHTML = cellData;
                }
                row.appendChild(cell);
            });

            tbody.appendChild(row);
        });
    }

    buildLegend();

    function downloadSchedule() {
    // Check if there are actually activities to print
    if (activities.length === 0) {
        alert("Please add at least one activity to your timetable before downloading!");
        return;
    }

    // Turn off edit mode automatically so delete buttons don't clip into the download
    if (isEditMode) {
        toggleEdit();
    }
    
    // Trigger browser print window cleanly
    window.print();
}
</script>

</body>
</html>
